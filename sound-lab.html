<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dreamtales — sound lab</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #141a33 url("sky-watercolor-2.jpg") center / cover no-repeat;
    color: #efe6cf; font-family: "Cormorant Garamond", Georgia, serif;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: #efe6cf; color: #2b2238; padding: 34px 40px 30px; max-width: 560px;
    box-shadow: 0 10px 30px rgba(0,0,0,.45); transform: rotate(-0.6deg);
    clip-path: polygon(0 1%, 3% 0, 40% 1%, 70% 0, 100% 1.5%, 99.5% 50%, 100% 98%, 60% 100%, 20% 99%, 0 100%, .6% 60%);
  }
  h1 { font-size: 34px; margin: 0 0 4px; font-style: italic; }
  p.sub { margin: 0 0 22px; font-size: 18px; opacity: .8; }
  .opt {
    display: block; width: 100%; text-align: left; margin: 0 0 10px; padding: 12px 16px;
    font: 500 19px "Cormorant Garamond", serif; color: #2b2238; cursor: pointer;
    background: #f7f0de; border: 1.5px solid #2b2238; border-radius: 2px;
  }
  .opt b { font-family: "Special Elite", monospace; font-weight: normal; font-size: 15px; margin-right: 8px; }
  .opt span { display: block; font-size: 15px; opacity: .7; margin-top: 2px; }
  .opt.on { background: #2b2238; color: #efe6cf; }
  .row { display: flex; gap: 10px; margin-top: 14px; }
  .row button {
    flex: 1; padding: 10px; font: 15px "Special Elite", monospace; cursor: pointer;
    background: #4a3b2a; color: #efe6cf; border: none;
  }
  #stars { display: flex; flex-wrap: wrap; gap: 6px; }
  #stars span {
    font: 13px "Special Elite", monospace; padding: 5px 8px; background: #241d33; color: #efe6cf;
    cursor: default; border-radius: 2px; transition: background .2s;
  }
  #stars span::before { content: "\2726  "; color: #f3d98b; }
  #stars span:hover { background: #4a3b2a; }
  #now { font-family: "Special Elite", monospace; font-size: 14px; margin-top: 16px; min-height: 18px; opacity: .75; }
</style>
</head>
<body>
<div class="card">
  <h1>sound lab</h1>
  <p class="sub">three takes on a Gris-like ambient. pick one, let it play a minute or two.</p>
  <button class="opt" data-mode="piano"><b>A</b>piano alone<span>a soft felt piano wandering in D minor, lots of space and reverb</span></button>
  <button class="opt" data-mode="strings"><b>B</b>piano + strings<span>the same piano over slow low strings that swell and fade</span></button>
  <button class="opt" data-mode="full"><b>C</b>full: choir + celesta<span>adds a wordless choir now and then and little celesta echoes</span></button>
  <p class="sub" style="margin:18px 0 8px">hover the stars: each dream theme has its own sound</p>
  <div id="stars"></div>
  <div class="row"><button id="stop">stop</button></div>
  <div id="now"></div>
</div>
<script src="ambient-gris.js"></script>
<script>
  let live = null;
  const opts = document.querySelectorAll(".opt"), now = document.getElementById("now");
  opts.forEach(b => b.onclick = () => {
    opts.forEach(o => o.classList.toggle("on", o === b));
    if (!live) live = GrisAmbient.start(b.dataset.mode);
    else { live.ac.resume(); live.eng.setMode(b.dataset.mode); live.out.gain.setTargetAtTime(0.9, live.ac.currentTime, 0.8); }
  });
  document.getElementById("stop").onclick = () => {
    if (live) { live.out.gain.setTargetAtTime(0, live.ac.currentTime, 0.5); setTimeout(() => live && live.ac.suspend(), 1500); }
    opts.forEach(o => o.classList.remove("on"));
  };
  const THEMES = [["house","Houses",0],["family","Family",0],["school","School",1],["travel","Journeys",0],["water","Water",1],
    ["love","Love",1],["death","Death",1],["falling","Falling",2],["flying","Flying",2],["dance","Music & dance",1],
    ["animals","Animals",1],["chase","Being chased",2],["fire","Fire",2],["storm","Storms",3],["sky","Sky & stars",2],
    ["moon","The moon",4],["monsters","Monsters & ghosts",3],["aliens","Aliens & UFOs",3],["dragons","Dragons",4],
    ["castle","Castles",4],["none","everyday",0]];
  const box = document.getElementById("stars");
  THEMES.forEach(([id, label, lvl]) => {
    const el = document.createElement("span"); el.textContent = label; box.appendChild(el);
    el.onmouseenter = () => {
      if (!live) { opts[2].click(); }
      live.ac.resume(); live.eng.star(id, lvl);
    };
  });
  setInterval(() => {
    if (live && live.ac.state === "running") now.textContent = "now playing · " + live.eng.mode + " · " + live.eng.currentChord().name;
  }, 500);
</script>
</body>
</html>
